name: flutter_chat_app
description: A WhatsApp-style real-time chat app using Firebase Auth + Cloud Firestore only.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase (Auth + Firestore only -- no Storage, no FCM)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State management
  provider: ^6.1.2

  # UX / utility
  intl: ^0.19.0
  uuid: ^4.4.2
  timeago: ^3.7.0
  url_launcher: ^6.3.0     # to open Google Maps for shared locations
  geolocator: ^13.0.1      # to read device coordinates for location sharing
  flutter_slidable: ^3.1.1 # swipe-to-reply / swipe actions
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
